<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internship Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7" width="18" height="13" rx="2" />
              <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
          </span>
          <span class="brand-name">Internship Tracker</span>
        </div>
        <div class="applied-stat" aria-live="polite">
          <span id="applied-total">0</span> applied
        </div>
      </div>
    </header>

    <main class="container">
      <section class="intro">
        <h1>Find your next tech internship</h1>
        <p>
          Live postings from the
          <a href="https://github.com/SimplifyJobs/Summer2027-Internships" target="_blank" rel="noopener">SimplifyJobs list</a>,
          updated daily. Mark the ones you apply to so you never lose track.
        </p>
      </section>

      <section class="toolbar" aria-label="Search and filters">
        <div class="search-row">
          <label class="search">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <span class="visually-hidden">Search</span>
            <input id="search-input" type="search" placeholder="Search company or role" autocomplete="off" />
          </label>
          <button id="filters-toggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filter-panel">
            Filters<span id="active-filter-count" class="filter-count" hidden></span>
          </button>
        </div>

        <div id="filter-panel" class="filter-panel">
          <label class="field">
            <span>Role</span>
            <select id="role-select">
              <option value="all">All roles</option>
            </select>
          </label>
          <label class="field">
            <span>Location</span>
            <select id="location-select">
              <option value="all">Anywhere</option>
              <option value="remote">Remote (US)</option>
            </select>
          </label>
          <label class="field">
            <span>Degree</span>
            <select id="degree-select">
              <option value="all">Any degree</option>
              <option value="Bachelor's">Open to Bachelor's</option>
              <option value="Master's">Open to Master's</option>
              <option value="PhD">Open to PhD</option>
            </select>
          </label>
          <label class="field">
            <span>Term</span>
            <select id="term-select">
              <option value="all">All terms</option>
            </select>
          </label>
        </div>
      </section>

      <div class="list-header">
        <div class="tabs" role="tablist" aria-label="Which postings to show">
          <button class="tab" type="button" role="tab" data-status="all" aria-selected="true">All</button>
          <button class="tab" type="button" role="tab" data-status="not-applied" aria-selected="false">To apply</button>
          <button class="tab" type="button" role="tab" data-status="applied" aria-selected="false">Applied</button>
        </div>
        <p id="summary" class="summary" aria-live="polite"></p>
      </div>

      <div id="message" class="message" hidden></div>
      <ul id="posting-list" class="posting-list"></ul>
      <button id="show-more-button" class="button button-secondary show-more" type="button" hidden>Show more</button>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
